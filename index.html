<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enregistrement du scan QR</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;display:grid;place-items:center;min-height:100vh;color:#17202a}
main{background:white;width:min(92%,440px);padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001;text-align:center}
h1{font-size:23px}p{line-height:1.8;color:#566}
#status{padding:14px;border-radius:10px;background:#eef2f7;margin-top:18px}
.ok{background:#e7f8ee!important;color:#126b36}.bad{background:#fff0ed!important;color:#9d2b1e}
small{color:#778}
</style>
</head>
<body>
<main>
  <h1>Enregistrement du scan</h1>
  <p>Un scan sera enregistré pour ce code.</p>
  <div id="status">Enregistrement en cours...</div>
  <p><small>Chaque ouverture du lien est enregistrée comme un scan indépendant, même si la même personne a déjà scanné ce code auparavant.</small></p>
</main>
<script>
/* ===== Placez l'URL de la base de données Firebase ici ===== */
const FIREBASE_DB_URL = "https://magaza-f6681-default-rtdb.europe-west1.firebasedatabase.app";
/* =========================================================== */

const statusBox = document.getElementById("status");
function show(message, cls=""){ statusBox.textContent = message; statusBox.className = cls; }

function validConfig(){
  return FIREBASE_DB_URL.startsWith("https://") &&
         !FIREBASE_DB_URL.includes("YOUR-PROJECT");
}

async function recordScan(){
  const params = new URLSearchParams(location.search);
  const zone = (params.get("zone") || "").trim();

  if(!zone || !/^[a-zA-Z0-9_-]{1,50}$/.test(zone)){
    show("Lien QR invalide : aucune zone spécifiée.", "bad");
    return;
  }
  if(!validConfig()){
    show("Veuillez d'abord renseigner l'URL Firebase dans le fichier scan.html.", "bad");
    return;
  }

  try {
    // POST crée un nouvel enregistrement avec un identifiant unique + horodatage serveur
    const res = await fetch(`${FIREBASE_DB_URL}/scans.json`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ zone: zone, createdAt: { ".sv": "timestamp" } })
    });
    const saved = await res.json();
    if(!res.ok) throw new Error(saved.error || "Impossible d'enregistrer l'opération");

    show("✅ Scan enregistré avec succès. Merci !", "ok");
  } catch(err){
    show("Impossible d'enregistrer l'opération : " + err.message, "bad");
  }
}
recordScan();
</script>
</body>
</html>S
